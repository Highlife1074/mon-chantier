<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chantier Pro - Pilotage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-content { display: none !important; }
        .tab-content.active { display: flex !important; flex-direction: column; height: 100%; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex overflow-hidden">

    <!-- MENU LATÉRAL -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <div class="p-6 text-2xl font-bold border-b border-slate-800">🏗️ Chantier Pro</div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <button onclick="switchTab('plan')" class="nav-btn flex items-center w-full p-3 rounded-lg bg-blue-600 text-white" id="btn-plan">📍 Plan & Pièces</button>
            <button onclick="switchTab('gantt')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-300 hover:bg-slate-800" id="btn-gantt">📅 Planning</button>
            <button onclick="switchTab('sequences')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-300 hover:bg-slate-800" id="btn-sequences">⚙️ Séquences</button>
            <button onclick="switchTab('sd')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-300 hover:bg-slate-800" id="btn-sd">📄 Shop Drawings</button>
            <button onclick="switchTab('issues')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-300 hover:bg-slate-800" id="btn-issues">⚠️ Bloquants</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center px-8 shadow-sm">
            <h2 id="current-tab-title" class="text-xl font-bold text-slate-800">Plan & Pièces</h2>
        </header>

        <section class="flex-1 p-6 overflow-hidden">
            
            <!-- PLAN -->
            <div id="tab-plan" class="tab-content active">
                <div id="drag-drop-zone" class="flex-1 border-4 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center bg-white mb-4">
                    <p class="text-slate-400">Glissez votre plan ici pour commencer</p>
                </div>
                <div id="canvas-container" class="hidden flex-1 shadow-lg rounded-xl overflow-hidden bg-slate-200 border"></div>
                <div id="piece-editor" class="hidden mt-4 p-4 bg-white rounded-lg shadow border flex gap-4 items-center">
                    <input type="text" id="new-piece-name" placeholder="Nom de la pièce" class="border p-2 rounded">
                    <select id="new-piece-seq" class="border p-2 rounded select-seq-list"></select>
                    <input type="date" id="new-piece-date" class="border p-2 rounded">
                    <button onclick="saveNewPiece()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">Valider</button>
                </div>
            </div>

            <!-- GANTT -->
            <div id="tab-gantt" class="tab-content">
                <div id="gantt-render" class="bg-white p-6 rounded-xl shadow border h-full overflow-auto space-y-4"></div>
            </div>

            <!-- SÉQUENCES -->
            <div id="tab-sequences" class="tab-content overflow-auto">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow border">
                        <h3 class="font-bold mb-4">Nouvelle Séquence[cite: 1]</h3>
                        <input type="text" id="seq-name" placeholder="Nom du pack" class="w-full border p-2 mb-4 rounded">
                        <div id="tasks-list" class="space-y-2">
                            <div class="flex gap-2 bg-slate-50 p-2 rounded">
                                <input type="text" placeholder="Tâche" class="w-1/3 border p-1 rounded t-name">
                                <input type="number" placeholder="Jours" class="w-16 border p-1 rounded t-days">
                                <input type="text" placeholder="Ent." class="w-1/4 border p-1 rounded t-ent">
                                <label class="text-[10px]"><input type="checkbox" class="t-overlap"> Overlap</label>
                            </div>
                        </div>
                        <button onclick="addTaskRow()" class="text-blue-600 text-sm font-bold mt-2">+ Étape</button>
                        <button onclick="saveSequence()" class="w-full bg-blue-600 text-white py-2 rounded mt-4">Enregistrer[cite: 1]</button>
                    </div>
                    <div id="list-sequences" class="bg-white p-6 rounded-xl shadow border space-y-2"></div>
                </div>
            </div>

            <!-- SD -->
            <div id="tab-sd" class="tab-content">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow border">
                        <h3 class="font-bold mb-4">Lier un SD[cite: 1]</h3>
                        <input type="text" id="sd-ref" placeholder="Référence" class="w-full border p-2 mb-4 rounded">
                        <select id="sd-piece" class="w-full border p-2 mb-4 rounded select-pieces-list"></select>
                        <button onclick="saveSD()" class="w-full bg-green-600 text-white py-2 rounded">Valider[cite: 1]</button>
                    </div>
                    <div id="list-sd" class="bg-white p-6 rounded-xl shadow border space-y-2"></div>
                </div>
            </div>

            <!-- BLOQUANTS -->
            <div id="tab-issues" class="tab-content">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow border">
                        <h3 class="font-bold mb-4 text-red-600">Nouveau Blocage[cite: 1]</h3>
                        <select id="issue-piece" class="w-full border p-2 mb-4 rounded select-pieces-list"></select>
                        <textarea id="issue-desc" placeholder="Description..." class="w-full border p-2 mb-4 rounded h-24"></textarea>
                        <button onclick="saveIssue()" class="w-full bg-red-600 text-white py-2 rounded">Signaler[cite: 1]</button>
                    </div>
                    <div id="list-issues" class="bg-white p-6 rounded-xl shadow border space-y-2"></div>
                </div>
            </div>

        </section>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => { el.classList.remove('bg-blue-600','text-white'); el.classList.add('text-slate-300'); });
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('bg-blue-600','text-white');
            const t = {'plan':'Plan & Pièces','gantt':'Planning','sequences':'Séquences','sd':'Shop Drawings','issues':'Bloquants'};
            document.getElementById('current-tab-title').innerText = t[tabId];
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
