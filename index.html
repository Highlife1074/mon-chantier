<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chantier Pro - Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <style>
        .tab-content { display: none !important; }
        .tab-content.active { display: flex !important; flex-direction: column; height: 100%; }
        .nav-btn.active { background-color: #2563eb; color: white; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex overflow-hidden font-sans text-slate-900">

    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <div class="p-6 text-xl font-bold border-b border-slate-800 text-blue-400 font-mono">🏗️ CHANTIER PRO</div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <button onclick="switchTab('plan')" class="nav-btn active flex items-center w-full p-3 rounded-lg" id="btn-plan">📍 Plan & Affectation</button>
            <button onclick="switchTab('gantt')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-gantt">📅 Planning 6j/7</button>
            <button onclick="switchTab('sequences')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-sequences">⚙️ Séquences Travaux</button>
            <button onclick="switchTab('issues')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-issues">⚠️ Base Bloquants</button>
        </nav>
    </aside>

            <div class="text-[10px] bg-slate-100 px-3 py-1 rounded-full font-bold text-slate-500">6 JOURS / 7</div>
        </header>

        <section class="flex-1 p-4 overflow-hidden">

                    <div id="drag-drop-zone" class="flex-1 border-4 border-dashed border-slate-300 rounded-xl flex items-center justify-center bg-white text-slate-400">Déposez le plan ici</div>
                    <div id="canvas-container" class="hidden flex-1 shadow-inner rounded-xl overflow-hidden bg-slate-200 border"></div>

                        <div class="flex-1">
                            <label class="text-[10px] font-bold uppercase text-slate-400">Nom de la pièce</label>
                            <input type="text" id="p-edit-name" class="w-full border p-2 rounded text-sm">
                        </div>
                        <div class="flex-1">
                            <label class="text-[10px] font-bold uppercase text-slate-400">Séquence</label>
                            <select id="p-edit-seq" class="w-full border p-2 rounded text-sm select-seq-list"></select>
                        </div>
                        <div class="flex-1">
                            <label class="text-[10px] font-bold uppercase text-slate-400">Date début</label>
                            <input type="date" id="p-edit-date" class="w-full border p-2 rounded text-sm">
                        </div>
