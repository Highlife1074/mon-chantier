<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chantier Pro - Ordonnancement Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <style>
        .tab-content { display: none !important; }
        .tab-content.active { display: flex !important; flex-direction: column; height: 100%; }
        .nav-btn.active { background-color: #2563eb; color: white; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex overflow-hidden font-sans text-slate-900">

    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <div class="p-6 text-xl font-bold border-b border-slate-800 text-blue-400 font-mono">🏗️ CHANTIER PRO</div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <button onclick="switchTab('plan')" class="nav-btn active flex items-center w-full p-3 rounded-lg" id="btn-plan">📍 Plan & Affectation</button>
            <button onclick="switchTab('gantt')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-gantt">📅 Planning Expert</button>
            <button onclick="switchTab('sequences')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-sequences">⚙️ Séquences (Liens)</button>
            <button onclick="switchTab('issues')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-issues">⚠️ Bloquants</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-14 bg-white border-b border-slate-200 flex items-center px-8 justify-between shadow-sm">
            <h2 id="current-tab-title" class="text-lg font-bold text-slate-700">Plan & Affectation</h2>
            <div class="flex items-center gap-4">
                <span class="text-[10px] bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-bold">RÉSEAU DE DÉPENDANCES ACTIF</span>
            </div>
        </header>

        <section class="flex-1 p-4 overflow-hidden">
            
            <div id="tab-plan" class="tab-content active h-full flex flex-row gap-4">
                <div class="flex-1 flex flex-col">
                    <div id="drag-drop-zone" class="flex-1 border-4 border-dashed border-slate-300 rounded-xl flex items-center justify-center bg-white text-slate-400">Déposez le plan ici</div>
                    <div id="canvas-container" class="hidden flex-1 shadow-inner rounded-xl overflow-hidden bg-slate-200 border"></div>
                    
                    <div id="piece-editor" class="hidden mt-4 p-4 bg-white rounded-xl shadow-lg border-2 border-blue-100 flex gap-4 items-end">
                        <div class="flex-1"><label class="text-[10px] font-bold uppercase text-slate-400">Nom pièce</label><input type="text" id="p-edit-name" class="w-full border p-2 rounded text-sm bg-slate-50"></div>
                        <div class="flex-1"><label class="text-[10px] font-bold uppercase text-slate-400">Séquence</label><select id="p-edit-seq" class="w-full border p-2 rounded text-sm select-seq-list"></select></div>
                        <div class="flex-1"><label class="text-[10px] font-bold uppercase text-slate-400">Date Début</label><input type="date" id="p-edit-date" class="w-full border p-2 rounded text-sm"></div>
                        <button id="btn-save-piece" onclick="processPiece()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Valider</button>
                        <button onclick="cancelPieceEdit()" class="text-slate-400 text-xs mb-2">Annuler</button>
                    </div>
                </div>
                <div class="w-72 bg-white rounded-xl shadow-lg border p-4 flex flex-col">
                    <h3 class="font-bold text-slate-700 mb-2 border-b pb-2">Bloquants</h3>
                    <div id="sidebar-issues-list" class="flex-1 overflow-auto space-y-2 py-2"></div>
                </div>
            </div>

            <div id="tab-gantt" class="tab-content">
                <div id="gantt-render" class="bg-white p-6 rounded-xl shadow border h-full overflow-auto space-y-4"></div>
            </div>

            <div id="tab-sequences" class="tab-content overflow-auto">
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 h-full">
                    <div class="lg:col-span-3 bg-white p-6 rounded-xl shadow border overflow-auto">
                        <h3 class="font-bold mb-4" id="seq-form-title">Paramétrage du Réseau de Tâches</h3>
                        <input type="text" id="seq-name" placeholder="Nom de la séquence" class="w-full border p-3 mb-4 rounded font-bold bg-slate-50 border-slate-300">
                        
                        <div class="grid grid-cols-12 gap-2 mb-2 px-2 text-[9px] uppercase font-bold text-slate-400">
                            <div class="col-span-1">#</div>
                            <div class="col-span-3">Désignation Tâche</div>
                            <div class="col-span-1">Jours</div>
                            <div class="col-span-2">Entreprise</div>
                            <div class="col-span-2">Lien</div>
                            <div class="col-span-1">Préc.</div>
                            <div class="col-span-1">Lag</div>
                            <div class="col-span-1"></div>
                        </div>
                        <div id="tasks-list" class="space-y-2"></div>
                        
                        <div class="flex justify-between items-center mt-6">
                            <button onclick="addTaskRow()" class="bg-slate-100 text-slate-700 px-4 py-2 rounded font-bold text-xs hover:bg-slate-200">+ Ajouter Tâche</button>
                            <div class="flex gap-2">
                                <button id="btn-cancel-seq" onclick="resetSeqForm()" class="hidden px-4 py-2 text-slate-500 font-bold">Annuler</button>
                                <button onclick="saveSequence()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg">Enregistrer Séquence</button>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow border overflow-auto">
                        <h3 class="font-bold mb-4 border-b pb-2 text-[10px] uppercase text-slate-400">Bibliothèque</h3>
                        <div id="list-sequences" class="space-y-2"></div>
                    </div>
                </div>
            </div>

            <div id="tab-issues" class="tab-content">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
                    <div class="bg-white p-6 rounded-xl shadow border">
                        <h3 class="font-bold mb-4 text-red-600 uppercase text-xs">Nouveau Bloquant</h3>
                        <textarea id="issue-desc" placeholder="Description du blocage..." class="w-full border p-3 mb-4 rounded h-32 bg-slate-50"></textarea>
                        <button onclick="saveIssue()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold shadow-lg">Enregistrer</button>
                    </div>
                    <div id="list-issues-full" class="bg-white p-6 rounded-xl shadow border overflow-auto space-y-2 h-[500px]"></div>
                </div>
            </div>

        </section>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
            document.getElementById('current-tab-title').innerText = document.getElementById('btn-' + tabId).innerText;
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
