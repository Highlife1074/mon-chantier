// DANS APP.JS, remplacez la partie qui génère l'affichage des plans par :
onSnapshot(collection(db, "plans"), (s) => {
    allPlans = s.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById('plans-list').innerHTML = allPlans.map(p => `
        <div class="flex items-center gap-2 group p-2 border rounded-lg bg-white hover:bg-blue-50 transition-all">
            <div onclick="selectPlan('${p.id}')" class="flex-1 cursor-pointer text-[10px] truncate ${currentPlanId === p.id ? 'font-bold text-blue-600' : ''}">
                📄 ${p.name}
            </div>
            <button onclick="deletePlan('${p.id}')" class="text-red-400 hover:text-red-600 p-1">
                🗑️
            </button>
        </div>
    `).join('');
});
