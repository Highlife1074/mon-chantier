<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chantier Pro - Pilotage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <style>
        .tab-content { display: none !important; }
        .tab-content.active { display: flex !important; flex-direction: column; height: 100%; }
        .nav-btn.active { background-color: #2563eb; color: white; }
        #canvas-container canvas { cursor: crosshair !important; background-color: #f1f5f9; }
        #piece-editor { z-index: 1000; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden font-sans text-slate-900">

    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <div class="p-6 text-xl font-bold border-b border-slate-800 text-blue-400 font-mono italic">🏗️ CHANTIER PRO</div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <button onclick="switchTab('plan')" class="nav-btn active flex items-center w-full p-3 rounded-lg transition-all font-bold" id="btn-plan">📍 Plans & Dessin</button>
            <button onclick="switchTab('gantt')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-gantt">📅 Planning Expert</button>
            <button onclick="switchTab('sequences')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-sequences">⚙️ Séquences</button>
            <button onclick="switchTab('issues')" class="nav-btn flex items-center w-full p-3 rounded-lg text-slate-400 hover:bg-slate-800" id="btn-issues">⚠️ Bloquants</button>
        </nav>
        <div class="p-4 text-[9px] text-slate-500 bg-black/20">
            GAUCHE : Dessiner | DROIT/MOLETTE : Déplacer | ZOOM : Molette
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-14 bg-white border-b border-slate-200 flex items-center px-8 justify-between shadow-sm">
            <h2 id="current-tab-title" class="text-lg font-bold text-slate-700">Plans & Dessin</h2>
            <div id="upload-progress" class="hidden text-xs text-blue-600 font-bold animate-pulse">CHARGEMENT...</div>
        </header>

        <section class="flex-1 p-4 overflow-hidden relative">
            <div id="tab-plan" class="tab-content active h-full flex flex-row gap-4">
                <div class="w-64 flex flex-col gap-4">
                    <div id="mini-drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-4 bg-white text-center text-[10px] text-slate-400 hover:border-blue-400 cursor-pointer">
                        + Glissez une IMAGE de plan ici
                    </div>
                    <div class="flex-1 bg-white rounded-xl shadow-sm border p-3 overflow-auto">
                        <h3 class="text-[10px] font-bold uppercase text-slate-400 mb-3 border-b pb-1 text-center font-bold">Mes Plans</h3>
                        <div id="plans-list" class="space-y-2"></div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col relative overflow-hidden bg-slate-200 rounded-xl border-2 border-slate-300">
                    <div id="canvas-container" class="flex-1 relative overflow-hidden">
                        <div id="no-plan-message" class="absolute inset-0 flex items-center justify-center text-slate-400 italic">Sélectionnez un plan à gauche</div>
                    </div>
                    
                    <div id="piece-editor" class="hidden absolute bottom-4 left-4 right-4 p-4 bg-white rounded-xl shadow-2xl border-2 border-blue-500 flex gap-4 items-end animate-in slide-in-from-bottom-4">
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-slate-500 uppercase">Nom de la zone</label>
                            <input type="text" id="p-edit-name" class="w-full border p-2 rounded text-sm bg-slate-50">
                        </div>
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-slate-500 uppercase">Séquence</label>
                            <select id="p-edit-seq" class="w-full border p-2 rounded text-sm select-seq-list bg-slate-50"></select>
                        </div>
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-slate-500 uppercase">Date début</label>
                            <input type="date" id="p-edit-date" class="w-full border p-2 rounded text-sm bg-slate-50">
                        </div>
                        <button onclick="processPiece()" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold shadow-lg hover:bg-blue-700 transition-colors">VALIDER</button>
                        <button onclick="cancelPieceEdit()" class="text-slate-400 text-xs mb-2 hover:text-red-500 underline">Annuler</button>
                    </div>
                </div>

                <div class="w-64 bg-white rounded-xl shadow-lg border p-4 flex flex-col">
                    <h3 class="font-bold text-slate-700 mb-2 border-b pb-2 text-xs flex justify-between uppercase">Bloquants <span id="count-unassigned" class="bg-red-100 text-red-700 px-2 rounded-full">0</span></h3>
                    <div id="sidebar-issues-list" class="flex-1 overflow-auto space-y-2"></div>
                </div>
            </div>

            <div id="tab-gantt" class="tab-content overflow-auto p-4">
                <div id="gantt-render" class="space-y-4"></div>
            </div>

            <div id="tab-sequences" class="tab-content overflow-auto p-4">
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <div class="lg:col-span-3 bg-white p-6 rounded-xl shadow border">
                        <h3 class="font-bold mb-4 uppercase text-sm">Modèle de Séquence</h3>
                        <input type="text" id="seq-name" placeholder="Nom de la séquence" class="w-full border p-3 mb-4 rounded font-bold bg-slate-50">
                        <div id="tasks-list" class="space-y-2"></div>
                        <button onclick="addTaskRow()" class="mt-4 text-blue-600 text-xs font-bold">+ Ajouter Tâche</button>
                        <button onclick="saveSequence()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold mt-6 shadow-lg">Enregistrer le modèle</button>
                    </div>
                    <div id="list-sequences" class="bg-white p-4 rounded-xl shadow border space-y-2 overflow-auto"></div>
                </div>
            </div>

            <div id="tab-issues" class="tab-content p-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
                    <div class="bg-white p-6 rounded-xl shadow border h-fit">
                        <h3 class="font-bold mb-4 text-red-600 uppercase text-xs">Nouveau Bloquant</h3>
                        <textarea id="issue-desc" placeholder="Décrivez le problème..." class="w-full border p-3 mb-4 rounded h-32 bg-slate-50"></textarea>
                        <button onclick="saveIssue()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold shadow-lg">Ajouter à la base</button>
                    </div>
                    <div id="list-issues-full" class="bg-white p-6 rounded-xl shadow border overflow-auto space-y-2 h-[500px]"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            const targetTab = document.getElementById('tab-' + tabId);
            const targetBtn = document.getElementById('btn-' + tabId);
            if(targetTab && targetBtn) {
                targetTab.classList.add('active');
                targetBtn.classList.add('active');
                document.getElementById('current-tab-title').innerText = targetBtn.innerText;
            }
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
